# SMARTDOC Application Configuration
spring.application.name=smartdoc-system
# Dynamic Port Assignment for Render/Cloud Platforms (Defaults to 8090 locally)
server.port=${PORT:8090}
server.servlet.context-path=/

# JSP View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**

# Database Configuration (Reads environment variables from Render/Cloud, falls back to local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartdoc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0241mcsd}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Custom SMARTDOC Application Properties
smartdoc.storage.location=storage/documents
smartdoc.storage.qrcode-location=storage/qrcodes
smartdoc.app.base-url=http://localhost:8090
smartdoc.security.session-timeout-minutes=30

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartdoc=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Gmail SMTP Mail Configuration (OTP Delivery)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sdmsniet@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ucbvolhpptaozxui}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Error properties
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

