# ====================================================================
# SMARTDOC Application Configuration - Supabase Cloud PostgreSQL Profile
# Activate via: spring.profiles.active=supabase
# ====================================================================

# Database Configuration (Supabase PostgreSQL)
# Replace [YOUR-PROJECT-REF] with your Supabase project reference id (e.g. abcdefghijklmnop)
# Replace [YOUR-PASSWORD] with your Supabase database password
#
# Option A: Direct Connection (Port 5432)
# spring.datasource.url=jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres?sslmode=require
#
# Option B: Session Pooler (Port 5432) or Transaction Pooler (Port 6543) - Recommended for Cloud
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:db.your-project-ref.supabase.co}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require

spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:your-supabase-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool (HikariCP) optimizations for Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
